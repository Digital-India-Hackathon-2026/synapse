<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindMitra AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#F4F1FC;
  --bg-2:#FFFFFF;
  --ink:#1C1030;
  --ink-soft:#382A54;
  --purple-900:#2E1A5C;
  --purple-700:#4F2FA8;
  --purple-600:#6C3FD1;
  --purple-500:#8257E5;
  --purple-200:#D9CDF7;
  --purple-100:#EEE8FC;
  --purple-50:#F7F4FE;
  --text-secondary:#635B78;
  --text-muted:#9A93AC;
  --white:#FFFFFF;
  --success-bg:#E4F4EA;
  --success-ink:#1E7B4D;
  --warning-bg:#FCF1DE;
  --warning-ink:#9A6512;
  --danger-bg:#FBE7E5;
  --danger-ink:#B23A2E;
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-card: 0 12px 34px rgba(52,26,110,0.09);
  --shadow-soft: 0 4px 16px rgba(52,26,110,0.06);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:linear-gradient(160deg, var(--bg-1) 0%, #FFFFFF 55%);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{ font-family:var(--font-display); color:var(--purple-900); font-weight:700; letter-spacing:-0.01em; }
p{ line-height:1.55; }
button{ font-family:var(--font-body); cursor:pointer; }
:focus-visible{ outline:3px solid var(--purple-500); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

.pill-btn{
  background:var(--purple-600);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:14px 28px;
  font-size:16px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:8px;
  box-shadow:0 8px 20px rgba(108,63,209,0.28);
  transition:transform .15s ease, box-shadow .15s ease;
}
.pill-btn:hover{ transform:translateY(-1px); box-shadow:0 12px 26px rgba(108,63,209,0.34); }
.pill-btn:active{ transform:translateY(0px) scale(.98); }
.pill-btn.secondary{
  background:#fff; color:var(--purple-700); border:1.5px solid var(--purple-200); box-shadow:none;
}
.pill-btn.large{ padding:20px 36px; font-size:19px; }
.pill-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

.badge-pill{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--purple-100); color:var(--purple-700);
  border-radius:999px; padding:7px 16px; font-size:13px; font-weight:600;
}

.card{
  background:#fff; border-radius:var(--radius-md); box-shadow:var(--shadow-card);
  padding:22px;
}
.card-flat{
  background:#fff; border-radius:var(--radius-sm); box-shadow:var(--shadow-soft); padding:16px;
}
.icon-circle{
  width:44px; height:44px; border-radius:50%; background:var(--purple-100);
  display:flex; align-items:center; justify-content:center; color:var(--purple-600); font-size:20px; flex-shrink:0;
}

/* ===== App shell ===== */
#app{ min-height:100vh; display:flex; }
.sidebar{
  width:250px; flex-shrink:0; background:#fff; border-right:1px solid #EFEAFA;
  padding:24px 18px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh;
}
.sidebar .logo{ display:flex; align-items:center; gap:10px; padding:6px 10px 22px; }
.sidebar .logo .mark{ width:34px; height:34px; border-radius:10px; background:var(--purple-600); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; font-family:var(--font-display);}
.sidebar .logo span{ font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--purple-900); }
.nav-item{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;
  color:var(--text-secondary); font-weight:600; font-size:14.5px; background:transparent; border:none; width:100%; text-align:left;
}
.nav-item .ic{ width:20px; text-align:center; font-size:17px; }
.nav-item:hover{ background:var(--purple-50); color:var(--purple-700); }
.nav-item.active{ background:var(--purple-100); color:var(--purple-700); }
.sidebar-foot{ margin-top:auto; padding:12px 10px; }

.main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:transparent;
}
.topbar .streak{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-secondary); font-weight:600; }
#view{ flex:1; padding:6px 28px 100px; max-width:1080px; width:100%; margin:0 auto; }
.view-inner{ animation:fadein .28s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.bottom-nav{ display:none; }

@media (max-width: 880px){
  .sidebar{ display:none; }
  #view{ padding:6px 16px 96px; }
  .topbar{ padding:14px 16px; }
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #EFEAFA;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:50; box-shadow:0 -6px 20px rgba(52,26,110,0.06);
  }
  .bottom-nav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-muted); font-size:10.5px; font-weight:600; padding:6px 2px;
  }
  .bottom-nav button .ic{ font-size:19px; }
  .bottom-nav button.active{ color:var(--purple-600); }
}

/* simple mode */
body.simple-mode h1{ font-size:38px !important; }
body.simple-mode h2{ font-size:28px !important; }
body.simple-mode p, body.simple-mode .simple-text{ font-size:19px !important; line-height:1.6 !important; }
body.simple-mode .pill-btn{ padding:20px 30px; font-size:19px; }
body.simple-mode .nav-item{ font-size:17px; padding:16px 14px; }
body.simple-mode .card, body.simple-mode .card-flat{ padding:26px; }

.grid{ display:grid; gap:16px; }
.grid-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.grid-4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
@media (max-width:700px){ .grid-4{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

.speak-btn{
  background:var(--purple-50); border:1.5px solid var(--purple-200); color:var(--purple-700);
  border-radius:999px; padding:9px 16px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
}
.speak-btn:hover{ background:var(--purple-100); }
.speak-btn.speaking{ background:var(--purple-600); color:#fff; border-color:var(--purple-600); }

.risk-tag{ display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 14px; font-weight:700; font-size:13px; }
.risk-low{ background:var(--success-bg); color:var(--success-ink); }
.risk-mod{ background:var(--warning-bg); color:var(--warning-ink); }
.risk-high{ background:var(--danger-bg); color:var(--danger-ink); }

.lang-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
@media (max-width:560px){ .lang-grid{ grid-template-columns:1fr; } }
.lang-btn{
  background:#fff; border:2px solid var(--purple-100); border-radius:20px; padding:22px; text-align:left;
  display:flex; align-items:center; gap:16px; box-shadow:var(--shadow-soft);
}
.lang-btn:hover{ border-color:var(--purple-500); }
.lang-btn .native{ font-family:var(--font-display); font-size:24px; color:var(--purple-900); font-weight:700; }
.lang-btn .eng{ font-size:13px; color:var(--text-muted); margin-top:2px; }
.lang-btn .glyph{ width:52px; height:52px; border-radius:14px; background:var(--purple-100); display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--purple-700); flex-shrink:0; }

.chip-row{ display:flex; gap:10px; flex-wrap:wrap; }
.chip{ background:var(--purple-50); border:1px solid var(--purple-100); color:var(--purple-700); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; }
.chip.on{ background:var(--purple-600); color:#fff; border-color:var(--purple-600); }

.progress-track{ height:8px; background:var(--purple-100); border-radius:999px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--purple-600); border-radius:999px; transition:width .3s ease; }

.week-bar{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.week-bar .stem{ width:100%; background:var(--purple-100); border-radius:10px; height:74px; display:flex; align-items:flex-end; overflow:hidden; }
.week-bar .fill{ width:100%; background:var(--purple-600); border-radius:10px 10px 0 0; }
.week-bar .lbl{ font-size:12px; color:var(--text-muted); font-weight:600; }

.tile{ background:#fff; border-radius:var(--radius-md); box-shadow:var(--shadow-soft); padding:20px; display:flex; flex-direction:column; gap:10px; border:1px solid #F1ECFC; }
.tile:hover{ box-shadow:var(--shadow-card); }

.memcard{ aspect-ratio:1; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:34px; background:var(--purple-100); border:2px solid transparent; }
.memcard.chosen{ border-color:var(--purple-600); background:var(--purple-200); }
.memcard.correct{ border-color:var(--success-ink); background:var(--success-bg); }
.memcard.missed{ border-color:var(--danger-ink); background:var(--danger-bg); }

.num-tap{ aspect-ratio:1; border-radius:16px; background:#fff; border:2px solid var(--purple-100); font-size:22px; font-weight:700; color:var(--purple-800,var(--purple-700)); }
.num-tap.done{ background:var(--purple-600); color:#fff; border-color:var(--purple-600); }

.chat-bubble{ max-width:78%; padding:12px 16px; border-radius:18px; font-size:15px; line-height:1.5; }
.chat-bubble.bot{ background:var(--purple-50); color:var(--ink); border-bottom-left-radius:4px; align-self:flex-start; }
.chat-bubble.user{ background:var(--purple-600); color:#fff; border-bottom-right-radius:4px; align-self:flex-end; }

.spec-card{ display:flex; gap:14px; padding:16px; border-radius:16px; background:#fff; box-shadow:var(--shadow-soft); align-items:flex-start; }

.mic-orb{
  width:120px; height:120px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--purple-500), var(--purple-700));
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:44px; margin:0 auto; box-shadow:0 14px 34px rgba(108,63,209,.35);
  border:none;
}
.mic-orb.rec{ animation:pulse 1.2s infinite; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(108,63,209,.45), 0 14px 34px rgba(108,63,209,.35);} 70%{ box-shadow:0 0 0 22px rgba(108,63,209,0), 0 14px 34px rgba(108,63,209,.35);} 100%{ box-shadow:0 0 0 0 rgba(108,63,209,0), 0 14px 34px rgba(108,63,209,.35);} }

textarea, input[type=text]{
  width:100%; border:1.5px solid var(--purple-100); border-radius:14px; padding:12px 14px; font-family:var(--font-body);
  font-size:15px; color:var(--ink); background:#fff;
}
textarea:focus, input[type=text]:focus{ border-color:var(--purple-500); }

.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

@media print{
  #app > *:not(.print-area){ display:none !important; }
  .print-area{ display:block !important; max-width:800px; margin:0 auto; }
}
.print-area{ display:none; }

.landing-shell .hero-card{ background:#fff; border-radius:28px; box-shadow:var(--shadow-card); padding:26px; }

.sos-fab{
  position:fixed; right:24px; bottom:28px; z-index:60;
  width:66px; height:66px; border-radius:50%;
  background:#E0332B; color:#fff; border:none;
  box-shadow:0 10px 26px rgba(224,51,43,.42);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:21px; line-height:1; gap:2px; animation:sospulse 2.4s infinite;
}
.sos-fab span{ font-size:9.5px; font-weight:800; letter-spacing:.5px; }
@keyframes sospulse{ 0%{ box-shadow:0 0 0 0 rgba(224,51,43,.4), 0 10px 26px rgba(224,51,43,.42);} 70%{ box-shadow:0 0 0 16px rgba(224,51,43,0), 0 10px 26px rgba(224,51,43,.42);} 100%{ box-shadow:0 0 0 0 rgba(224,51,43,0), 0 10px 26px rgba(224,51,43,.42);} }
@media (max-width:880px){ .sos-fab{ bottom:88px; right:16px; width:58px; height:58px; font-size:19px; } }

.sos-overlay{
  position:fixed; inset:0; background:rgba(28,16,48,.55); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.sos-modal{
  background:#fff; border-radius:28px; max-width:420px; width:100%; padding:32px 28px;
  text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.28);
}
.sos-btn-red{ background:#E0332B !important; box-shadow:0 8px 20px rgba(224,51,43,.35) !important; }
.sos-btn-red:hover{ background:#C42A22 !important; }
</style>

<!-- Socket.IO client — connects the patient app to the MindMitra location backend (see /backend) -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* ================= STATE ================= */
const LANGS = [
  {code:'en-IN', key:'en', native:'English', eng:'English', glyph:'A'},
  {code:'hi-IN', key:'hi', native:'हिन्दी', eng:'Hindi', glyph:'अ'},
  {code:'te-IN', key:'te', native:'తెలుగు', eng:'Telugu', glyph:'త'},
  {code:'ta-IN', key:'ta', native:'தமிழ்', eng:'Tamil', glyph:'த'},
  {code:'kn-IN', key:'kn', native:'ಕನ್ನಡ', eng:'Kannada', glyph:'ಕ'},
  {code:'bn-IN', key:'bn', native:'বাংলা', eng:'Bengali', glyph:'ব'},
  {code:'mr-IN', key:'mr', native:'मराठी', eng:'Marathi', glyph:'म'},
];

const I18N = {
  en:{ home:'Home', screening:'Screening', daily:'Daily exercise', chat:'AI companion', caregiver:'Caregiver mode', report:'Clinical report', specialists:'Find specialist', settings:'Settings',
    welcome:'Welcome back', weeklyScore:'Weekly cognitive score', startScreening:'Start free screening', lowRisk:'Low risk', readAloud:'Read aloud', listening:'Listening...' },
  hi:{ home:'होम', screening:'स्क्रीनिंग', daily:'दैनिक अभ्यास', chat:'एआई साथी', caregiver:'देखभाल मोड', report:'क्लिनिकल रिपोर्ट', specialists:'विशेषज्ञ खोजें', settings:'सेटिंग्स',
    welcome:'वापसी पर स्वागत है', weeklyScore:'साप्ताहिक संज्ञानात्मक स्कोर', startScreening:'मुफ्त स्क्रीनिंग शुरू करें', lowRisk:'कम जोखिम', readAloud:'ज़ोर से पढ़ें', listening:'सुन रहा है...' },
  te:{ home:'హోమ్', screening:'స్క్రీనింగ్', daily:'రోజువారీ వ్యాయామం', chat:'AI సహచరుడు', caregiver:'సంరక్షకుని మోడ్', report:'క్లినికల్ నివేదిక', specialists:'నిపుణుడిని కనుగొనండి', settings:'సెట్టింగ్‌లు',
    welcome:'తిరిగి స్వాగతం', weeklyScore:'వారపు కాగ్నిటివ్ స్కోర్', startScreening:'ఉచిత స్క్రీనింగ్ ప్రారంభించండి', lowRisk:'తక్కువ ప్రమాదం', readAloud:'బిగ్గరగా చదవండి', listening:'వింటోంది...' },
  ta:{ home:'முகப்பு', screening:'திரையிடல்', daily:'தினசரி பயிற்சி', chat:'AI துணை', caregiver:'பராமரிப்பாளர் பயன்முறை', report:'மருத்துவ அறிக்கை', specialists:'நிபுணரைக் கண்டறியவும்', settings:'அமைப்புகள்',
    welcome:'மீண்டும் வருக', weeklyScore:'வாராந்திர அறிவாற்றல் மதிப்பெண்', startScreening:'இலவச திரையிடலைத் தொடங்குங்கள்', lowRisk:'குறைந்த ஆபத்து', readAloud:'சத்தமாக படிக்க', listening:'கேட்கிறது...' },
  kn:{ home:'ಮುಖಪುಟ', screening:'ಸ್ಕ್ರೀನಿಂಗ್', daily:'ದೈನಂದಿನ ವ್ಯಾಯಾಮ', chat:'AI ಸಂಗಾತಿ', caregiver:'ಆರೈಕೆದಾರ ಮೋಡ್', report:'ಕ್ಲಿನಿಕಲ್ ವರದಿ', specialists:'ತಜ್ಞರನ್ನು ಹುಡುಕಿ', settings:'ಸೆಟ್ಟಿಂಗ್‌ಗಳು',
    welcome:'ಮತ್ತೆ ಸ್ವಾಗತ', weeklyScore:'ವಾರದ ಅರಿವಿನ ಅಂಕ', startScreening:'ಉಚಿತ ಸ್ಕ್ರೀನಿಂಗ್ ಪ್ರಾರಂಭಿಸಿ', lowRisk:'ಕಡಿಮೆ ಅಪಾಯ', readAloud:'ಗಟ್ಟಿಯಾಗಿ ಓದಿ', listening:'ಆಲಿಸುತ್ತಿದೆ...' },
  bn:{ home:'হোম', screening:'স্ক্রিনিং', daily:'দৈনিক ব্যায়াম', chat:'AI সঙ্গী', caregiver:'কেয়ারগিভার মোড', report:'ক্লিনিক্যাল রিপোর্ট', specialists:'বিশেষজ্ঞ খুঁজুন', settings:'সেটিংস',
    welcome:'ফিরে আসার জন্য স্বাগতম', weeklyScore:'সাপ্তাহিক জ্ঞানীয় স্কোর', startScreening:'ফ্রি স্ক্রিনিং শুরু করুন', lowRisk:'কম ঝুঁকি', readAloud:'জোরে পড়ুন', listening:'শুনছে...' },
  mr:{ home:'होम', screening:'स्क्रीनिंग', daily:'दैनंदिन व्यायाम', chat:'एआय सोबती', caregiver:'काळजीवाहू मोड', report:'क्लिनिकल अहवाल', specialists:'तज्ज्ञ शोधा', settings:'सेटिंग्ज',
    welcome:'पुन्हा स्वागत आहे', weeklyScore:'साप्ताहिक संज्ञानात्मक गुण', startScreening:'मोफत स्क्रीनिंग सुरू करा', lowRisk:'कमी धोका', readAloud:'मोठ्याने वाचा', listening:'ऐकत आहे...' },
};

const STATE = {
  onboarded: false,
  lang: LANGS[0],
  simpleMode: false,
  scores: { memory: null, attention: null, speech: null, executive: null, clock: null },
  weekly: [72, 76, 79, 82],
  streak: 4,
  history: [],
  chat: [],
  reminders: [
    { id:1, text:'Take memory support medicine', time:'9:00 AM', done:false },
    { id:2, text:'Evening walk with family', time:'6:00 PM', done:false },
  ],
  alerts: [
    { id:1, text:'Speech fluency improved by 6% this week.', tone:'good' },
  ],
  screeningStep: 0,
  transcript: '',
  translation: '',
  emergencyContact: { name: 'Priya (Daughter)', phone: '+919876543210' },
  sosLog: [],
  // ---- Live location sharing (see LOCATION TRACKING block below) ----
  location: {
    sharing: false,          // ON only when the person explicitly enables it — this is consent-based
    lat: null,
    lng: null,
    accuracy: null,
    updatedAt: null,
    watchId: null,
  },
  patientAccount: null,      // { id, token, pairingCode } once registered with the backend
  caregivers: [],            // caregivers currently linked/authorized to view this person's location
};

function t(key){ const d = I18N[STATE.lang.key] || I18N.en; return d[key] || I18N.en[key] || key; }

/* ================= SPEECH HELPERS ================= */
let currentUtterance = null;
function speak(text, btnEl){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = STATE.lang.code;
    u.rate = STATE.simpleMode ? 0.9 : 1;
    if(btnEl){ btnEl.classList.add('speaking'); u.onend = ()=> btnEl.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  }catch(e){ console.warn('speech synthesis unavailable', e); }
}

function hasRecognition(){ return ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window); }
function micErrorMessage(err){
  if(err==='not-allowed' || err==='permission-denied'){
    return "Microphone access was blocked. If you're viewing this inside a chat preview, download the file and open it in a normal browser tab (or host it with HTTPS) — then allow microphone access when your browser asks. You can also just type your answer below.";
  }
  if(err==='no-speech'){ return "I didn't hear anything — please try again, or type your answer below."; }
  if(err==='audio-capture'){ return "No microphone was found on this device. Please type your answer below."; }
  if(err==='not-supported'){ return "Voice input isn't supported in this browser — please use Chrome, or type your answer below."; }
  return "Voice input isn't available right now — please type your answer below.";
}
function startListening(onResult, onEnd){
  if(!hasRecognition()){ onEnd && onEnd('not-supported'); return null; }
  if(!window.isSecureContext){ onEnd && onEnd('not-allowed'); return null; }
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new Rec();
  rec.lang = STATE.lang.code;
  rec.interimResults = true;
  rec.continuous = true;
  let gotResult = false;
  rec.onresult = (e)=>{
    gotResult = true;
    let text = '';
    for(let i=0;i<e.results.length;i++){ text += e.results[i][0].transcript + ' '; }
    onResult(text.trim());
  };
  rec.onerror = (e)=>{ onEnd && onEnd(e.error || 'unknown'); };
  rec.onend = ()=>{ onEnd && onEnd(gotResult ? null : 'no-speech'); };
  try{ rec.start(); }catch(err){ onEnd && onEnd('unknown'); return null; }
  return rec;
}

/* ================= CLAUDE API HELPER ================= */
async function callClaude(content, system){
  try{
    const body = { model:'claude-sonnet-4-6', max_tokens:1000, messages:[{ role:'user', content }] };
    if(system) body.system = system;
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json();
    const textBlock = (data.content || []).find(b=>b.type==='text');
    return textBlock ? textBlock.text : null;
  }catch(e){ console.warn('AI call failed', e); return null; }
}

async function translateToEnglish(text, fromLangName){
  const result = await callClaude(
    `Translate the following spoken cognitive-screening answer from ${fromLangName} to clear English for a doctor's review. Keep hesitations or repeated words as [pause] or [repeated] markers if present. Only return the translation, nothing else.\n\nText: "${text}"`
  );
  return result || '(Translation unavailable right now — please try again once online.)';
}

async function chatbotReply(userMsg, history){
  const historyText = history.slice(-6).map(m=>`${m.role==='user'?'User':'Companion'}: ${m.text}`).join('\n');
  const sys = `You are a warm, patient, empathetic voice companion inside a dementia-screening app for elderly Indian users, some of whom may have low literacy. Reply in ${STATE.lang.eng} using very simple, short sentences (2-4 sentences max). Be kind and reassuring. Never give a medical diagnosis; gently suggest talking to family or a doctor for medical concerns.`;
  const result = await callClaude(`${historyText}\nUser: ${userMsg}`, sys);
  return result || "I'm here with you. I couldn't reach my thinking service just now — could you say that again in a moment?";
}

async function reviewClockDrawing(dataUrl){
  try{
    const base64 = dataUrl.split(',')[1];
    const body = {
      model:'claude-sonnet-4-6', max_tokens:500,
      messages:[{ role:'user', content:[
        { type:'image', source:{ type:'base64', media_type:'image/png', data: base64 } },
        { type:'text', text:'This is a Clock Drawing Test from a dementia cognitive-screening app. Evaluate number placement, correct clock-hand positions, and overall spatial organization. Respond ONLY as compact JSON: {"score": <0-100 integer>, "feedback": "<one short encouraging sentence, plain language>"}' }
      ]}]
    };
    const res = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    if(!textBlock) throw new Error('no text');
    const clean = textBlock.text.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  }catch(e){
    return { score: 78, feedback: "Couldn't reach the AI reviewer right now, so here's a placeholder score. Try again when you're online for a full review." };
  }
}

/* ================= LOCATION TRACKING ================= */
/* Lets a person's registered caregivers see where they are, whenever the person turns sharing on.
   Talks to the backend in /backend over REST + a live Socket.IO push.
   Everything here fails gracefully into a "local-only" demo mode if no backend is reachable,
   so the file still runs standalone if you just open it in a browser. */

const LOCATION_API_BASE = (window.MINDMITRA_API_BASE) || 'http://localhost:4000';
let locationSocket = null;

async function apiCall(path, opts={}){
  const res = await fetch(LOCATION_API_BASE + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('Request failed: ' + res.status));
  return data;
}

// Runs once, the first time the app loads on this device: creates a patient record on the
// backend and remembers the credentials locally so future visits don't re-register.
async function ensurePatientAccount(){
  const saved = localStorage.getItem('mindmitra_patient_account');
  if(saved){ STATE.patientAccount = JSON.parse(saved); return STATE.patientAccount; }
  try{
    const data = await apiCall('/api/patients/register', { method:'POST', body: JSON.stringify({ name: 'MindMitra user' }) });
    STATE.patientAccount = { id:data.patientId, token:data.token, pairingCode:data.pairingCode };
    localStorage.setItem('mindmitra_patient_account', JSON.stringify(STATE.patientAccount));
    return STATE.patientAccount;
  }catch(e){
    console.warn('Location backend not reachable — running in local-only demo mode.', e.message);
    return null;
  }
}

// Pulls the caregivers who are currently authorized to see this person's location.
async function refreshCaregiverList(){
  if(!STATE.patientAccount) return;
  try{
    const data = await apiCall('/api/patients/me', { headers:{ Authorization:'Bearer '+STATE.patientAccount.token } });
    STATE.caregivers = data.caregivers || [];
    STATE.patientAccount.pairingCode = data.pairingCode;
  }catch(e){ console.warn('Could not refresh caregiver list:', e.message); }
}

// Revokes one caregiver's access — they immediately stop being able to see this person's location.
async function revokeCaregiver(caregiverId){
  if(!STATE.patientAccount) return;
  if(!confirm('Remove this caregiver\'s access to your location?')) return;
  try{
    await apiCall('/api/caregivers/'+caregiverId, { method:'DELETE', headers:{ Authorization:'Bearer '+STATE.patientAccount.token } });
    await refreshCaregiverList();
    go('settings');
  }catch(e){ alert('Could not remove caregiver: ' + e.message); }
}

// The master on/off switch. The person is always the one who decides whether they're visible.
async function toggleLocationSharing(){
  const enabling = !STATE.location.sharing;
  if(enabling){
    if(!STATE.patientAccount) await ensurePatientAccount();
    if(!navigator.geolocation){ alert('This device/browser does not support location sharing.'); return; }
    startWatchingLocation();
  } else {
    stopWatchingLocation();
  }
  STATE.location.sharing = enabling;
  if(STATE.patientAccount){
    try{ await apiCall('/api/patients/sharing', { method:'POST', headers:{ Authorization:'Bearer '+STATE.patientAccount.token }, body: JSON.stringify({ enabled: enabling }) }); }
    catch(e){ console.warn('Could not sync sharing state to backend:', e.message); }
  }
  connectLocationSocket();
  go(currentScreen);
}

function startWatchingLocation(){
  if(STATE.location.watchId != null) return;
  STATE.location.watchId = navigator.geolocation.watchPosition(
    pos => onLocationTick(pos),
    err => console.warn('Location error:', err.message),
    { enableHighAccuracy:true, maximumAge:15000, timeout:20000 }
  );
}
function stopWatchingLocation(){
  if(STATE.location.watchId != null){ navigator.geolocation.clearWatch(STATE.location.watchId); }
  STATE.location.watchId = null;
}

async function onLocationTick(pos){
  STATE.location.lat = pos.coords.latitude;
  STATE.location.lng = pos.coords.longitude;
  STATE.location.accuracy = pos.coords.accuracy;
  STATE.location.updatedAt = new Date();
  if(STATE.patientAccount){
    try{
      await apiCall('/api/location/ping', {
        method:'POST',
        headers:{ Authorization:'Bearer '+STATE.patientAccount.token },
        body: JSON.stringify({ lat: STATE.location.lat, lng: STATE.location.lng, accuracy: STATE.location.accuracy })
      });
    }catch(e){ console.warn('Could not send location ping:', e.message); }
  }
  if(currentScreen==='caregiver' || currentScreen==='settings') go(currentScreen);
}

function connectLocationSocket(){
  if(!STATE.patientAccount || typeof io === 'undefined') return;
  if(!locationSocket){ locationSocket = io(LOCATION_API_BASE, { transports:['websocket','polling'] }); }
  locationSocket.emit('join-patient-room', { patientId: STATE.patientAccount.id });
}

function copyPairingCode(){
  if(!STATE.patientAccount) return;
  navigator.clipboard && navigator.clipboard.writeText(STATE.patientAccount.pairingCode);
  alert('Pairing code copied: ' + STATE.patientAccount.pairingCode + '\nShare this with a caregiver so they can add themselves in the Caregiver Dashboard app.');
}

function locationMapEmbedUrl(lat, lng, delta=0.01){
  const left = lng - delta, right = lng + delta, top = lat + delta, bottom = lat - delta;
  return `https://www.openstreetmap.org/export/embed.html?bbox=${left}%2C${bottom}%2C${right}%2C${top}&layer=mapnik&marker=${lat}%2C${lng}`;
}

let speechRecInstance = null;
function toggleSpeechCapture(){
  const orb = document.getElementById('micOrb');
  const status = document.getElementById('micStatus');
  if(speechRecInstance){
    speechRecInstance.stop(); speechRecInstance = null;
    orb.classList.remove('rec'); status.textContent = 'Tap the microphone to answer';
    return;
  }
  status.style.color = 'var(--text-muted)';
  orb.classList.add('rec'); status.textContent = t('listening');
  speechRecInstance = startListening(
    (text)=>{ STATE.transcript = text; document.getElementById('speechTranscript').value = text; },
    (err)=>{
      orb.classList.remove('rec'); speechRecInstance=null;
      if(err){ status.style.color = 'var(--danger-ink)'; status.textContent = micErrorMessage(err); }
      else { status.style.color = 'var(--text-muted)'; status.textContent = 'Tap the microphone to answer'; }
    }
  );

async function runTranslate(){
  STATE.transcript = document.getElementById('speechTranscript').value;
  if(!STATE.transcript.trim()){ return; }
  const btn = document.getElementById('translateBtn');
  btn.textContent = 'Translating…'; btn.disabled = true;
  const result = await translateToEnglish(STATE.transcript, STATE.lang.eng);
  STATE.translation = result;
  document.getElementById('translateBox').style.display = 'block';

  btn.textContent = '🌐 Translate to English'; btn.disabled = false;
}
function finishSpeechStep(){

  go('memoryGame');
}

let clockCtx = null;
afterRenderMap.clockGame = function(){
  const canvas = document.getElementById('clockCanvas');
  clockCtx = canvas.getContext('2d');
  clockCtx.lineWidth = 3; clockCtx.lineCap = 'round'; clockCtx.strokeStyle = '#4F2FA8';
  let drawing = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX-r.left) * (canvas.width/r.width), y: (p.clientY-r.top) * (canvas.height/r.height) };
  }
  function start(e){ drawing = true; const p = pos(e); clockCtx.beginPath(); clockCtx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); clockCtx.lineTo(p.x,p.y); clockCtx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);
};
function clearClockCanvas(){ if(clockCtx) clockCtx.clearRect(0,0,360,360); }
async function submitClockDrawing(){
  const canvas = document.getElementById('clockCanvas');
  const btn = document.getElementById('clockSubmitBtn');
  btn.textContent = 'AI is reviewing…'; btn.disabled = true;
  const dataUrl = canvas.toDataURL('image/png');
  const result = await reviewClockDrawing(dataUrl);
  STATE.scores.clock = result.score;
  document.getElementById('clockFeedback').innerHTML = `<div class="card-flat" style="text-align:left;">🕰️ <b>${result.score}/100</b> — ${result.feedback}</div>`;

}

const WORD_PUZZLES = [{ answer:'MEMORY', scrambled:'YOMERM' }, { answer:'FAMILY', scrambled:'YLIFAM' }, { answer:'GARDEN', scrambled:'DAERNG' }];
const CATEGORY_LIST = ['Fruits', 'Household items', 'Animals', 'Vegetables'];
const RECALL_OBJECTS = ['🔑','☂️','📖','🕯️','🧴'];
const STORY_TEXT = "Ramesh went to the market on Tuesday morning. He bought two mangoes and a loaf of bread. On his way home, he met his old friend Suresh near the temple.";
const STORY_QS = [
  { q:'What day did Ramesh go to the market?', a:'Tuesday' },
  { q:'What did Ramesh buy besides bread?', a:'Mangoes' },
];

renderers.dailyPlay = function(key){
  if(key==='memory') return renderers.memoryGame();
  if(key==='attention' || key==='reaction') return renderers.attentionGame();
  if(key==='word'){
    const p = WORD_PUZZLES[dayOfYear()%WORD_PUZZLES.length];
    return `
    <div style="padding-top:12px;max-width:560px;margin:0 auto;">
      <h1 style="font-size:26px;">Word puzzle</h1>
      <p style="color:var(--text-secondary);" class="simple-text">Unscramble the letters to find today's word.</p>
      <div class="card" style="text-align:center;">
        <div style="font-family:var(--font-display);font-size:40px;letter-spacing:10px;color:var(--purple-700);margin:20px 0;">${p.scrambled}</div>
        <input type="text" id="wordGuess" placeholder="Type your answer" style="max-width:260px;margin:0 auto 18px;text-align:center;">
        <div><button class="pill-btn" onclick="checkWordPuzzle('${p.answer}')">Check</button></div>
        <p id="wordFeedback" style="margin-top:14px;font-weight:600;"></p>
      </div>
    </div>`;
  }
  if(key==='category'){
    const cat = CATEGORY_LIST[dayOfYear()%CATEGORY_LIST.length];
    return `
    <div style="padding-top:12px;max-width:560px;margin:0 auto;">
      <h1 style="font-size:26px;">Category naming</h1>
      <p style="color:var(--text-secondary);" class="simple-text">Name as many ${cat.toLowerCase()} as you can in 30 seconds. Type each one and press Enter.</p>
      <div class="card">
        <p id="catTimer" style="text-align:center;color:var(--purple-700);font-weight:700;font-size:20px;">30s</p>
        <input type="text" id="catInput" placeholder="Type an item and press Enter" onkeydown="if(event.key==='Enter'){addCatItem();event.preventDefault();}">
        <div id="catList" class="chip-row" style="margin-top:14px;"></div>
        <div style="text-align:center;margin-top:18px;"><button class="pill-btn secondary" onclick="finishCategoryGame()">Finish now</button></div>
      </div>
    </div>`;
  }
  if(key==='recall'){
    return `
    <div style="padding-top:12px;max-width:560px;margin:0 auto;">
      <h1 style="font-size:26px;">Object recall</h1>
      <p style="color:var(--text-secondary);" class="simple-text">Remember these objects, then list them from memory.</p>
      <div class="card" style="text-align:center;">
        <div id="recallObjects" style="font-size:44px;letter-spacing:16px;margin:20px 0;">${RECALL_OBJECTS.join(' ')}</div>
        <p id="recallTimer" style="color:var(--text-muted);">Memorize... <b id="recallCount">5</b>s</p>
      </div>
    </div>`;
  }
  if(key==='story'){
    return `
    <div style="padding-top:12px;max-width:560px;margin:0 auto;">
      <h1 style="font-size:26px;">Story recall</h1>
      <p style="color:var(--text-secondary);" class="simple-text">Listen to or read the short story, then answer the questions.</p>
      <div class="card">
        <p style="font-size:16px;line-height:1.7;">${STORY_TEXT}</p>
        <button class="speak-btn" onclick="speak('${STORY_TEXT}', this)">🔊 ${t('readAloud')}</button>
        <button class="pill-btn" style="margin-top:18px;" onclick="go('storyQuestions')">I'm ready →</button>
      </div>
    </div>`;
  }
  return renderers.home();
};
afterRenderMap.dailyPlay = function(key){
  if(key==='recall'){
    let n=5;
    const timer = setInterval(()=>{
      n--; const el = document.getElementById('recallCount'); if(el) el.textContent=n;
      if(n<=0){ clearInterval(timer);
        document.getElementById('recallObjects').innerHTML = '';
        document.getElementById('recallTimer').innerHTML = `
          <input type="text" id="recallGuess" placeholder="Type the objects you remember, separated by commas" style="text-align:center;">
          <div style="margin-top:14px;"><button class="pill-btn" onclick="finishRecallGame()">Submit</button></div>`;
      }
    },1000);
  }
  if(key==='category'){
    window.__catItems = [];
    let n=30;
    window.__catTimer = setInterval(()=>{
      n--; const el = document.getElementById('catTimer'); if(el) el.textContent = n+'s';
      if(n<=0) finishCategoryGame();
    },1000);
  }
};
function checkWordPuzzle(answer){
  const guess = document.getElementById('wordGuess').value.trim().toUpperCase();
  const fb = document.getElementById('wordFeedback');
  fb.style.color = guess===answer ? 'var(--success-ink)' : 'var(--danger-ink)';
  fb.textContent = guess===answer ? '✅ Correct! Well done.' : `Not quite — the word was ${answer}.`;
  setTimeout(()=> go('home'), 1600);
}
function addCatItem(){
  const input = document.getElementById('catInput');
  const val = input.value.trim();
  if(val){ window.__catItems.push(val); document.getElementById('catList').innerHTML = window.__catItems.map(w=>`<span class="chip on">${w}</span>`).join(''); }
  input.value='';
}
function finishCategoryGame(){
  clearInterval(window.__catTimer);
  const count = (window.__catItems||[]).length;
  document.getElementById('view').innerHTML = `<div class="view-inner" style="max-width:520px;margin:60px auto;text-align:center;"><div class="card"><h2>Nice work!</h2><p style="color:var(--text-secondary);">You named ${count} items.</p><button class="pill-btn" style="margin-top:14px;" onclick="go('home')">Done</button></div></div>`;
}
function finishRecallGame(){
  const guess = (document.getElementById('recallGuess').value||'').toLowerCase();
  document.getElementById('view').innerHTML = `<div class="view-inner" style="max-width:520px;margin:60px auto;text-align:center;"><div class="card"><h2>Recall complete</h2><p style="color:var(--text-secondary);">Thanks — this is saved to your progress trend.</p><button class="pill-btn" style="margin-top:14px;" onclick="go('home')">Done</button></div></div>`;
}
renderers.storyQuestions = function(){

    <div class="card">
      ${STORY_QS.map((q,i)=>`<div style="margin-bottom:16px;"><p style="font-weight:600;">${q.q}</p><input type="text" id="storyA${i}" placeholder="Your answer"></div>`).join('')}

function toggleReminder(id){ const r = STATE.reminders.find(x=>x.id===id); if(r) r.done = !r.done; go('caregiver'); }
function addReminder(){
  const text = prompt('Reminder text:'); if(!text) return;
  const time = prompt('Time (e.g. 8:00 AM):') || '';
  STATE.reminders.push({ id: Date.now(), text, time, done:false });
  go('caregiver');
}

/* ================= AI CHATBOT ================= */
renderers.chat = function(){
  return `
  <div style="padding-top:12px;max-width:640px;margin:0 auto;">
    <h1 style="font-size:28px;">${t('chat')}</h1>
    <p style="color:var(--text-secondary);" class="simple-text">Talk anytime, in ${STATE.lang.native}. This is a companion, not a doctor.</p>
    <div class="card" style="margin-top:16px;">
      <div id="chatWindow" style="display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:420px;overflow-y:auto;padding:4px;"></div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="mic-orb" style="width:46px;height:46px;font-size:18px;" id="chatMic" onclick="toggleChatMic()">🎙️</button>
        <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter'){sendChat();}">
        <button class="pill-btn" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>
  `;
};
afterRenderMap.chat = function(){ renderChatWindow(); if(STATE.chat.length===0){ pushChat('bot', "Namaste! I'm here to talk whenever you like. How are you feeling today?"); } };
function renderChatWindow(){
  const win = document.getElementById('chatWindow');
  if(!win) return;
  win.innerHTML = STATE.chat.map(m=>`<div class="chat-bubble ${m.role==='user'?'user':'bot'}">${m.text}</div>`).join('');
  win.scrollTop = win.scrollHeight;
}
function pushChat(role, text){ STATE.chat.push({role,text}); renderChatWindow(); if(role==='bot') speak(text); }
async function sendChat(){
  const input = document.getElementById('chatInput');
  const msg = input.value.trim(); if(!msg) return;
  input.value=''; pushChat('user', msg);
  const thinking = { role:'bot', text:'…' }; STATE.chat.push(thinking); renderChatWindow();
  const reply = await chatbotReply(msg, STATE.chat);
  STATE.chat[STATE.chat.length-1] = { role:'bot', text: reply };
  renderChatWindow(); speak(reply);
}
let chatRec = null;
function toggleChatMic(){
  if(chatRec){ chatRec.stop(); chatRec=null; return; }
  document.getElementById('chatMic').classList.add('rec');
  chatRec = startListening(
    (text)=>{ document.getElementById('chatInput').value = text; },
    (err)=>{
      document.getElementById('chatMic').classList.remove('rec'); chatRec=null;
      if(err) alert(micErrorMessage(err));
    }
  );
}

/* ================= CLINICAL REPORT ================= */
renderers.report = function(){
  const s = STATE.scores;
  const overall = Math.round(((s.memory||70)+(s.attention||70)+(s.speech||70)+(s.executive||70)+(s.clock||70))/5);
  const riskLabel = overall>=70 ? 'Low risk' : overall>=45 ? 'Moderate risk' : 'High risk';
  const rows = [
    ['Date of assessment', new Date().toLocaleDateString()],
    ['Memory score', s.memory ?? '--'],
    ['Attention score', s.attention ?? '--'],
    ['Executive function score', s.executive ?? '--'],
    ['Speech analysis summary', s.speech!=null ? `Fluency score ${s.speech}/100` : '--'],
    ['Clock drawing score', s.clock ?? '--'],
    ['Overall AI risk level', riskLabel],
  ];
  document.getElementById('printArea') && (document.getElementById('printArea').innerHTML = `
    <h1>MindMitra AI — Clinical Screening Report</h1>
    <table style="width:100%;border-collapse:collapse;">${rows.map(r=>`<tr><td style="padding:8px;border-bottom:1px solid #ddd;font-weight:600;">${r[0]}</td><td style="padding:8px;border-bottom:1px solid #ddd;">${r[1]}</td></tr>`).join('')}</table>
    <p style="margin-top:18px;">This screening indicates changes in memory and language that may benefit from further medical evaluation. This is not a diagnosis. We recommend consulting a qualified healthcare professional.</p>
  `);
  return `
  <div style="padding-top:12px;max-width:660px;margin:0 auto;">
    <h1 style="font-size:28px;">${t('report')}</h1>
    <p style="color:var(--text-secondary);" class="simple-text">A doctor-ready summary you can download or share.</p>
    <div class="card" style="margin-top:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h3 style="font-size:17px;">Patient screening summary</h3>
        <span class="risk-tag ${overall>=70?'risk-low':overall>=45?'risk-mod':'risk-high'}">${riskLabel}</span>
      </div>
      ${rows.map(r=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1ECFC;font-size:14.5px;"><span style="color:var(--text-secondary);">${r[0]}</span><span style="font-weight:600;">${r[1]}</span></div>`).join('')}
      <p style="color:var(--text-secondary);font-size:14px;margin-top:14px;">This screening indicates changes worth discussing with a specialist. This is not a diagnosis.</p>
      <div style="display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;">
        <button class="pill-btn" onclick="window.print()">⬇️ Download as PDF</button>
        <button class="pill-btn secondary" onclick="go('specialists')">📍 Find a specialist to share this with</button>
      </div>
    </div>
  </div>
  `;
};
